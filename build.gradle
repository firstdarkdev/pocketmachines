plugins {
    id 'java'
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.8"
    id "dev.firstdark.unimined" version "1.0.9+1.4.2-SNAPSHOT" apply false
    id "com.hypherionmc.modutils.orion" version "2.0.+"
    id 'com.matyrobbrt.mc.registrationutils' version "26.1-0.1.0"
    id "com.hypherionmc.modutils.modpublisher" version "2.2.+"
}

var relType = project.properties["releaseType"] ?: "${release_type}"

ext {
    isPort = false //(relType == 'port')
}

orion.setup {
    multiProject = true
    enableMirrorMaven = true
    enableReleasesMaven = true
    enableSnapshotsMaven = isPort

    dopplerToken = System.getenv("DOPPLER_KEY")

    versioning {
        identifier("${relType}")
    }

    tools {
        lombok()
        autoService()
    }
}

registrationUtils {
    group 'com.hypherionmc.pocketmachines.reg'
    projects {
        Fabric { type 'Fabric' } // The fabric project
        NeoForge { type 'NeoForge' } // The neoforge project
        Common { type 'Common' } // The common project
    }
}

group = project_group

jar.enabled = false

subprojects {
    apply plugin: "dev.firstdark.unimined"
    apply plugin: "java"
    apply plugin: 'maven-publish'
    apply plugin: 'com.hypherionmc.modutils.modpublisher'

    group = rootProject.group
    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    // Add your maven repositories here
    repositories {
        mavenCentral()
    }

    dependencies {

    }

    jar {
        manifest {
            attributes([
                    'Specification-Title'     : 'PocketMachines',
                    'Specification-Vendor'    : mod_author,
                    'Specification-Version'   : project.version,
                    'Implementation-Title'    : project.name,
                    'Implementation-Version'  : project.version,
                    'Implementation-Vendor'   : mod_author,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    'Timestamp'               : System.currentTimeMillis(),
                    'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                    'Built-On-Minecraft'      : minecraft_version
            ])
        }
    }

    /**
     * ===============================================================================
     * =       DO NOT EDIT BELOW THIS LINE UNLESS YOU KNOW WHAT YOU ARE DOING        =
     * ===============================================================================
     */

    unimined.minecraft(sourceSets.main, true) {
        version minecraft_version
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 25
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }
}
